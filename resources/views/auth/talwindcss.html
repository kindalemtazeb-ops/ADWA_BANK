<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Records - Strict Search & Toggle</title>
    <script src="https://cdn.tailwindcss.com"></script>

    @vite(['resources/css/app.css', 'resources/js/app.js'])<!--npm run build(yhnn terminal lay tfen enasnesalen)-->
</head>
<body class="bg-slate-50 font-sans min-h-screen flex flex-col items-center py-12 px-4">

    <header class="text-center mb-10">
        <h1 class="text-4xl font-extrabold text-slate-800 tracking-tight mb-2">
            Student Records Portal
        </h1>
        <p class="text-slate-500">Strict Search by Exact Name/ID & Collapsible Form</p>
    </header>

    <div class="w-full max-w-4xl mb-4 flex justify-end">
        <button onclick="toggleStudentForm()" class="bg-green-600 hover:bg-green-700 text-white px-5 py-2.5 rounded-xl text-sm font-medium transition shadow-md flex items-center gap-2">
            <span id="toggleIcon">➕</span> <span id="toggleText">Add New Student</span>
        </button>
    </div>


    <div id="formContainer" class="hidden w-full max-w-4xl bg-white p-6 rounded-2xl shadow-md border border-slate-200 mb-6 transition-all duration-300">
        <h3 id="formTitle" class="text-lg font-semibold text-slate-800 mb-4">Register New Student</h3>
        <form id="studentForm" class="grid grid-cols-1 md:grid-cols-4 gap-4 items-end">
            <input type="hidden" id="editIndex" value="-1">

            <div>
                <label class="block text-xs font-bold text-slate-600 uppercase mb-1">First Name</label>
                <input type="text" id="fname" required class="w-full p-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500" placeholder="Abebe">
            </div>
            <div>
                <label class="block text-xs font-bold text-slate-600 uppercase mb-1">Last Name</label>
                <input type="text" id="lname" required class="w-full p-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500" placeholder="Alemu">
            </div>
            <div>
                <label class="block text-xs font-bold text-slate-600 uppercase mb-1">GPA</label>
                <input type="number" id="gpa" step="0.1" min="0" max="4" required class="w-full p-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500" placeholder="3.5">
            </div>
            <div>
                <label class="block text-xs font-bold text-slate-600 uppercase mb-1">ID Number</label>
                <input type="text" id="idNum" required class="w-full p-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500" placeholder="1212">
            </div>
            <div class="md:col-span-4 flex justify-end gap-2 mt-2">
                <button type="button" id="cancelBtn" onclick="resetFormState()" class="hidden bg-slate-200 hover:bg-slate-300 text-slate-700 px-5 py-2 rounded-lg text-sm font-medium transition">
                    Cancel
                </button>
                <button type="submit" id="submitBtn" class="bg-indigo-600 hover:bg-indigo-700 text-white px-5 py-2 rounded-lg text-sm font-medium transition shadow-md">
                    Save Record
                </button>
            </div>
        </form>
    </div>

    <div class="w-full max-w-4xl mb-4 flex gap-2">
        <div class="relative flex-1">
            <span class="absolute inset-y-0 left-0 flex items-center pl-4 pointer-events-none text-slate-400">
                🔍
            </span>
            <input type="text" id="searchBar" class="w-full pl-11 pr-4 py-3 border border-indigo-200 rounded-xl bg-white shadow-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 text-sm placeholder-slate-400 transition" placeholder="Enter exact First Name or exact ID...">
        </div>
        

        <button onclick="executeStrictSearch()" class="bg-indigo-600 hover:bg-indigo-700 text-white px-6 py-3 rounded-xl text-sm font-medium transition shadow-md">
            Search
        </button>

        <button id="clearSearchBtn" onclick="resetTable()" class="hidden bg-slate-200 hover:bg-slate-300 text-slate-700 px-5 py-3 rounded-xl text-sm font-medium transition border border-slate-300">
            Show All
        </button>
    </div>

    <div class="w-full max-w-4xl bg-white rounded-2xl shadow-xl shadow-slate-200/60 border border-slate-200 overflow-hidden">
        <div class="overflow-x-auto">
            <table class="w-full border-collapse text-left">
                <thead>
                    <tr class="bg-indigo-600 text-white text-sm uppercase font-semibold tracking-wider">
                        <th class="py-4 px-6">First Name</th>
                        <th class="py-4 px-6">Last Name</th>
                        <th class="py-4 px-6 text-center">GPA</th>
                        <th class="py-4 px-6">ID Number</th>
                        <th class="py-4 px-6 text-right">Actions</th>
                    </tr>
                </thead>
                <tbody id="studentTableBody" class="text-slate-600 divide-y divide-slate-100">
                    </tbody>
            </table>
        </div>

        <div class="bg-slate-50 p-4 border-t border-slate-100 flex justify-between items-center">
            <span id="studentCount" class="text-sm text-slate-500">Showing 0 students</span>
        </div>
    </div>

    <script>
        // የመረጃ አሬይ
        let students = [
            { fname: "Abebe", lname: "Alemu", gpa: "3.4", idNum: "1212" },
            { fname: "Aster", lname: "Kebede", gpa: "3.6", idNum: "1313" },
            { fname: "Kindnew", lname: "Fente", gpa: "3.8", idNum: "1616" },
            { fname: "asefa", lname: "abebe", gpa: "3.1", idNum: "1414" }
        ];

        const tableBody = document.getElementById("studentTableBody");
        const studentForm = document.getElementById("studentForm");
        const studentCount = document.getElementById("studentCount");
        const searchBar = document.getElementById("searchBar");
        const clearSearchBtn = document.getElementById("clearSearchBtn");

        const formContainer = document.getElementById("formContainer");
        const toggleIcon = document.getElementById("toggleIcon");
        const toggleText = document.getElementById("toggleText");

        const editIndexInput = document.getElementById("editIndex");
        const formTitle = document.getElementById("formTitle");
        const submitBtn = document.getElementById("submitBtn");
        const cancelBtn = document.getElementById("cancelBtn");

        // 1. ፎርሙን መደበቂያ እና ማሳያ (Toggle Form)
        function toggleStudentForm() {
            if (formContainer.classList.contains("hidden")) {
                formContainer.classList.remove("hidden");
                toggleText.textContent = "Close Form";
                toggleIcon.textContent = "✖";
            } else {
                formContainer.classList.add("hidden");
                toggleText.textContent = "Add New Student";
                toggleIcon.textContent = "➕";
                resetFormState();
            }
        }

        // 2. ቴብሉን መደበኛ ሁኔታ ማሳያ
        function renderTable(dataToShow = students) {
            tableBody.innerHTML = "";

            if (dataToShow.length === 0) {
                tableBody.innerHTML = `
                    <tr>
                        <td colspan="5" class="py-8 text-center text-slate-400 italic bg-slate-50/50">
                            No student found with that exact name or ID.
                        </td>
                    </tr>
                `;
                studentCount.textContent = `Showing 0 student(s)`;
                return;
            }

            dataToShow.forEach((student) => {
                const actualIndex = students.findIndex(s => s.idNum === student.idNum);
                const gpaBg = student.gpa >= 3.5 ? 'bg-indigo-100 text-indigo-700' : 'bg-green-100 text-green-700';

                const row = `
                    <tr class="hover:bg-indigo-50/50 transition-colors">
                        <td class="py-4 px-6 font-medium text-slate-900">${student.fname}</td>
                        <td class="py-4 px-6">${student.lname}</td>
                        <td class="py-4 px-6 text-center">
                            <span class="${gpaBg} py-1 px-3 rounded-full text-xs font-bold">${student.gpa}</span>
                        </td>
                        <td class="py-4 px-6 font-mono text-sm text-slate-400">#${student.idNum}</td>
                        <td class="py-4 px-6 text-right flex justify-end gap-3">
                            <button onclick="editStudent(${actualIndex})" class="text-indigo-600 hover:text-indigo-900 text-sm font-semibold transition">
                                Edit
                            </button>
                            <button onclick="deleteStudent(${actualIndex})" class="text-red-500 hover:text-red-700 text-sm font-semibold transition">
                                Delete
                            </button>
                        </td>
                    </tr>
                `;
                tableBody.innerHTML += row;
            });

            studentCount.textContent = `Showing ${dataToShow.length} student(s)`;
        }

        // 3. 🎯 ጥብቅ ፍለጋ (Strict Search - Exact Match)
        function executeStrictSearch() {
            const query = searchBar.value.toLowerCase().trim();

            if (query === "") {
                renderTable(students);
                clearSearchBtn.classList.add("hidden");
                return;
            }

            // እዚህ ጋር በ === ምልክት ሙሉ ስሙ ወይም ID በትክክል መመጣጠኑን ያረጋግጣል (includes የሚለው ቀርቷል)
            const filteredStudents = students.filter(student => {
                return student.fname.toLowerCase() === query || student.idNum === query;
            });

            renderTable(filteredStudents);
            clearSearchBtn.classList.remove("hidden"); // "Show All" ቁልፍን ማሳየት
        }

        // 4. ቴብሉን ወደ መደበኛ መመለሻ (Show All)
        function resetTable() {
            searchBar.value = "";
            renderTable(students);
            clearSearchBtn.classList.add("hidden"); // ቁልፉን ድጋሚ መደበቅ
        }

        // 5. መረጃ መመዝገብ / ማስተካከያ ማስቀመጥ
        studentForm.addEventListener("submit", function(e) {
            e.preventDefault();
            const currentEditIndex = parseInt(editIndexInput.value);

            const studentData = {
                fname: document.getElementById("fname").value,
                lname: document.getElementById("lname").value,
                gpa: document.getElementById("gpa").value,
                idNum: document.getElementById("idNum").value
            };

            if (currentEditIndex === -1) {
                students.push(studentData);
            } else {
                students[currentEditIndex] = studentData;
                resetFormState();
                toggleStudentForm(); // ኤዲት ተደርጎ ሲያልቅ ፎርሙን መዝጋት
            }

            resetTable();
            studentForm.reset();
        });

        // 6. ኤዲት ለማድረግ ፎርሙን ከፍቶ መረጃ መሙላት
        function editStudent(index) {
            const student = students[index];
            if(!student) return;

            // ፎርሙ ተዘግቶ ከሆነ መክፈት
            if (formContainer.classList.contains("hidden")) {
                toggleStudentForm();
            }

            document.getElementById("fname").value = student.fname;
            document.getElementById("lname").value = student.lname;
            document.getElementById("gpa").value = student.gpa;
            document.getElementById("idNum").value = student.idNum;

            editIndexInput.value = index;
            formTitle.textContent = "Edit Student Details";
            submitBtn.textContent = "Update Student";
            submitBtn.className = "bg-amber-500 hover:bg-amber-600 text-white px-5 py-2 rounded-lg text-sm font-medium transition shadow-md";
            cancelBtn.classList.remove("hidden");
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        // 7. የፎርም ሁኔታ ማጽጃ
        function resetFormState() {
            editIndexInput.value = "-1";
            formTitle.textContent = "Register New Student";
            submitBtn.textContent = "Save Record";
            submitBtn.className = "bg-indigo-600 hover:bg-indigo-700 text-white px-5 py-2 rounded-lg text-sm font-medium transition shadow-md";
            cancelBtn.classList.add("hidden");
            studentForm.reset();
        }

        // 8. መሰረዝ
        function deleteStudent(index) {
            if(confirm("Are you sure you want to delete this student?")) {
                students.splice(index, 1);
                resetTable();
            }
        }

        // መጀመሪያ ሙሉ ቴብሉን ማሳየት
        renderTable();
    </script>
</body>
</html>
